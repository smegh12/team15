<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Quest</title>
<style>
:root{--bg:#090d1c;--panel:#10172e;--line:#243056;--fg:#e8ecff;--mut:#7f8bb5;--ok:#34d399;--bad:#fb7185;--blue:#60a5fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
background:radial-gradient(1200px 600px at 20% -10%,#1a2350 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#2a1a4d 0,transparent 55%),var(--bg)}
.app{max-width:1240px;margin:0 auto;padding:18px 18px 6px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
header{display:flex;align-items:center;gap:12px}
h1{margin:0;font-size:20px;letter-spacing:.18em}
h1 b{color:#f472b6}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad)}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
#conn{color:var(--mut);margin-right:auto;font-size:12px}
button{background:linear-gradient(#3b4cca,#2b37a0);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;letter-spacing:.08em;cursor:pointer;box-shadow:0 4px 0 #1b2370}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #1b2370}
button.sm{padding:4px 10px;font-size:11px;border-radius:7px;background:#1b2650;border:1px solid #33437f;box-shadow:none}
button.sm:active{transform:none}
.hud{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:10px}
@media(max-width:900px){.hud{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px #0006 inset,0 8px 30px #0005}
.lbl{font-size:10px;letter-spacing:.2em;color:var(--mut);margin-bottom:6px}
.val{font-size:20px;font-weight:700;letter-spacing:.06em}
#badge{transition:color .3s}
.bar{height:16px;border-radius:9px;background:#0a1028;border:1px solid var(--line);overflow:hidden;margin-top:8px}
#fill{height:100%;width:50%;background:var(--blue);transition:width .4s,background .4s;box-shadow:0 0 14px currentColor}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;flex:1}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}
.panel{display:flex;flex-direction:column;padding:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0c1226;letter-spacing:.16em;font-size:12px}
.ph .sp{margin-left:auto;color:var(--mut);font-size:11px;letter-spacing:.05em}
.scope{position:relative;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 36px)}
#bandScope{height:210px}
#chScope{height:400px}
canvas{position:absolute;inset:0;width:100%;height:100%}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:300px}
.msg{display:flex;gap:10px;align-items:flex-end;animation:pop .25s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.av{width:30px;height:30px;border-radius:50%;background:#2b37a0;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.bub{background:#1b2650;border:1px solid #33437f;border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:15px;line-height:1.35;max-width:85%}
.bub small{display:block;color:var(--mut);font-size:10px;margin-top:4px;letter-spacing:.08em}
.sys{align-self:center;color:var(--mut);font-size:12px;text-align:center;padding:2px 8px}
.fine{text-align:right;color:var(--mut);font-size:10px;opacity:.5;letter-spacing:.05em;padding:2px 4px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>FOCUS <b>QUEST</b></h1><span class="dot" id="dot"></span><span id="conn">connecting...</span>
    <button id="cal">CALIBRATE</button>
  </header>
  <div class="hud">
    <div class="card"><div class="lbl">STATUS</div><div class="val" id="badge">STANDBY</div></div>
    <div class="card"><div class="lbl">FOCUS METER</div><div class="bar"><div id="fill"></div></div></div>
    <div class="card"><div class="lbl">FOCUS STREAK</div><div class="val" id="streak">0:00</div></div>
  </div>
  <main class="grid">
    <div class="col">
      <section class="card panel">
        <div class="ph">BRAIN WAVES<span class="sp">channel average</span></div>
        <div class="scope" id="bandScope"><canvas id="cvB"></canvas></div>
      </section>
      <section class="card panel">
        <div class="ph">CHANNELS<span class="sp" id="chInfo">1-40 Hz filtered</span><button class="sm" id="chMode">SHOW RAW</button></div>
        <div class="scope" id="chScope"><canvas id="cvC"></canvas></div>
      </section>
    </div>
    <section class="card panel">
      <div class="ph">PIP · CHECK-INS<span class="sp" id="ai"></span></div>
      <div id="chat"></div>
    </section>
  </main>
  <div class="fine"><span id="next">next check-in --:--</span> · <span id="last">no check-ins yet</span></div>
</div>
<script>
const BANDS=[['theta','THETA','4-8 Hz','#2dd4bf'],['alpha','ALPHA','8-13 Hz','#fbbf24'],['beta','BETA','13-30 Hz','#f472b6']];
const CHCOL=['#60a5fa','#a78bfa','#f472b6','#fb923c','#facc15','#4ade80','#2dd4bf','#38bdf8'];
const $=id=>document.getElementById(id);
const ST={idle:['STANDBY','#7f8bb5'],filling:['WARMING UP','#7f8bb5'],calibrating:['CALIBRATING','#60a5fa'],
focused:['FOCUSED','#34d399'],distracted:['DRIFTING','#fb7185'],artifact:['SIGNAL LOST','#7f8bb5']};
let fs=125,SHOW=375,NCH=8,LABELS=[],calibS=60,streak=0,ws,chMode='clean';
let bandBuf={},chBuf={clean:[],raw:[]};
function alloc(){SHOW=Math.round(fs*3);BANDS.forEach(([k])=>bandBuf[k]=new Float32Array(SHOW));
  for(const m of ['clean','raw'])chBuf[m]=Array.from({length:NCH},()=>new Float32Array(SHOW))}
alloc();
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function push(b,a){const n=Math.min(a.length,b.length);b.copyWithin(0,n);for(let i=0;i<n;i++)b[b.length-n+i]=a[a.length-n+i]}
function drawRows(cv,rows,small){
  const g=cv.getContext('2d'),r=cv.getBoundingClientRect(),d=devicePixelRatio||1;
  const W=Math.round(r.width*d),H=Math.round(r.height*d);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);
  if(!rows.length)return;
  const lh=r.height/rows.length;
  rows.forEach((row,i)=>{
    const b=row.data,n=b.length,cy=lh*(i+.5);let s=0;for(let j=0;j<n;j++)s+=b[j]*b[j];
    const rms=Math.sqrt(s/n),sc=lh*.4/(Math.max(rms,.5)*2.2);
    g.strokeStyle='#ffffff12';g.lineWidth=1;g.beginPath();g.moveTo(0,cy);g.lineTo(r.width,cy);g.stroke();
    g.shadowColor=row.color;g.shadowBlur=small?4:10;g.strokeStyle=row.color;g.lineWidth=small?1.2:2;g.lineJoin='round';g.beginPath();
    for(let j=0;j<n;j++){const x=r.width*j/(n-1),y=cy-Math.max(-lh*.48,Math.min(lh*.48,b[j]*sc));j?g.lineTo(x,y):g.moveTo(x,y)}
    g.stroke();g.shadowBlur=0;g.fillStyle=row.color;g.font=(small?'10px':'bold 12px')+' ui-monospace,monospace';
    g.fillText(row.label,10,lh*i+(small?13:20));
    if(small){g.fillStyle='#7f8bb5';g.fillText(rms.toFixed(1)+' µV rms',r.width-95,lh*i+13)}
  });
}
function draw(){
  drawRows($('cvB'),BANDS.map(([k,n,hz,c])=>({data:bandBuf[k],color:c,label:n+'  '+hz})),false);
  drawRows($('cvC'),chBuf[chMode].map((b,i)=>({data:b,color:CHCOL[i%CHCOL.length],label:LABELS[i]||'CH'+(i+1)})),true);
  requestAnimationFrame(draw);
}
function say(text,kind,meta){
  const c=$('chat'),e=document.createElement('div');
  if(kind==='sys'){e.className='sys';e.textContent=text}
  else{e.className='msg';e.innerHTML='<div class="av">P</div><div class="bub"><span></span><small></small></div>';
    e.querySelector('span').textContent=text;e.querySelector('small').textContent=meta||''}
  c.append(e);c.scrollTop=1e9;
}
function onState(s){
  const [lab,col]=ST[s.state]||ST.idle;
  $('badge').textContent=s.state==='calibrating'?'CALIBRATING '+Math.ceil(s.left)+'s':lab;$('badge').style.color=col;
  const f=$('fill');f.style.color=col;f.style.background=col;
  f.style.width=(s.score==null?(s.state==='calibrating'?100*(1-s.left/Math.max(1,calibS)):50)
    :Math.max(3,Math.min(100,(s.score+3)/6*100)))+'%';
  if(s.state==='focused')streak+=.5;else if(s.state==='distracted')streak=0;
  $('streak').textContent=mmss(streak);
  if(s.calib_failed&&!onState.warned){onState.warned=1;say('Not enough clean signal to calibrate. Check the electrodes and try again.','sys')}
}
function connect(){
  ws=new WebSocket('ws://localhost:8765');
  ws.onopen=()=>{$('dot').className='dot on';$('conn').textContent='connected'};
  ws.onclose=()=>{$('dot').className='dot';$('conn').textContent='reconnecting...';setTimeout(connect,1500)};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='hello'){fs=m.fs;NCH=m.n_ch;LABELS=m.labels||[];calibS=m.calib_s;alloc();
      $('ai').textContent=m.ai?'AI: '+m.model:'built-in phrases';$('chat').innerHTML='';
      say(m.demo?'Demo mode: simulated signal. Calibrates automatically, then alternates focused and drifting every 40 s.'
                :'Press CALIBRATE, then work on a focused task for 60 seconds.','sys');
      say('Check-ins appear here only when focus drops for a sustained stretch.','sys');}
    else if(m.type==='frame'){
      if(m.bands)for(const k in m.bands)push(bandBuf[k],m.bands[k]);
      if(m.ch)for(const md of ['clean','raw'])m.ch[md].forEach((a,i)=>{if(chBuf[md][i])push(chBuf[md][i],a)});
      $('next').textContent='next check-in '+mmss(m.chunk_left);if(m.state)onState(m.state)}
    else if(m.type==='checkin'){
      $('last').textContent='last check-in #'+m.n+': '+Math.round((1-m.summary.distracted_frac)*100)+'% focused'}
    else if(m.type==='coach')say(m.text,'coach','check-in '+m.n+' · drifting '+Math.round(m.summary.distracted_frac*100)+'%');
  };
}
$('cal').onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({cmd:'calibrate'}));
  say('Calibrating. Work on a focused task and keep still.','sys');onState.warned=0};
$('chMode').onclick=()=>{chMode=chMode==='clean'?'raw':'clean';
  $('chMode').textContent=chMode==='clean'?'SHOW RAW':'SHOW FILTERED';
  $('chInfo').textContent=chMode==='clean'?'1-40 Hz filtered':'raw (offset removed)'};
connect();requestAnimationFrame(draw);
</script>
</body>
</html>
